# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path prepend -- ensures app package is importable
prepend_sys_path = .

# Timezone for migration file timestamps
timezone = UTC

# SEC H-04: DATABASE_URL is the authoritative source. env.py reads it
# from app.config.Settings at migration time, so this placeholder is
# ignored in every non-offline invocation. Kept here only because
# alembic requires the key to exist.
sqlalchemy.url = postgresql+psycopg://bchemxtract:DEV_ONLY_PLACEHOLDER@localhost:5432/bchemxtract

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
