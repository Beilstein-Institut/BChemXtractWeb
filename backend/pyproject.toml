[project]
name = "bchemxtract-web"
version = "0.1.0"
description = "Web API for BChemXtract chemical structure extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "jpype1>=1.6.0",
    "python-multipart>=0.0.24",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.0",
    "pydantic-settings>=2.13.0",
    "psycopg[binary]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
