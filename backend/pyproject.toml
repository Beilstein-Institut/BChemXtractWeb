[project]
name = "bchemxtract-web"
version = "1.0.2"
description = "Web API for BChemXtract chemical structure extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "jpype1>=1.6.0",
    "python-multipart>=0.0.24",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.0",
    "pydantic-settings>=2.13.0",
    "psycopg[binary]>=3.3.0",
    "celery[redis]>=5.4.0",
    "sse-starlette>=2.0.0",
    "lxml>=5.3.0",
    "slowapi>=0.1.9",
    "httpx>=0.28.0",
    "cairosvg>=2.7.0",
    "fonttools>=4.55.0",
    "brotli>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "asgi-lifespan>=2.1.0",
]

# CI runs `pip install -e ".[dev]"` from backend/. Without explicit
# package config, setuptools' flat-layout discovery fails with
# "Multiple top-level packages discovered: ['lib', 'app', 'jars',
# 'alembic']" because we have several top-level directories alongside
# the actual Python package. The installed distribution only needs
# `app`; the others are build inputs (lib/, jars/), migrations
# (alembic/ — invoked via `alembic` CLI, not imported), or runner
# scripts (scripts/, tests/ — not distributed).
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
]
