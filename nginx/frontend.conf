server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy + companion hardening headers.
    #
    # default-src 'self'                only same-origin documents by default
    # img-src 'self' data: blob:        data: covers CDK SVG data URIs;
    #                                   blob: covers URL.createObjectURL for
    #                                   ZIP / export downloads
    # script-src 'self'                 no inline or remote scripts
    # style-src  'self' 'unsafe-inline' Tailwind v4 + style={...} attributes
    #                                   need inline styles; no user-authored
    #                                   style strings so risk is minimal
    # font-src   'self' data:           fontsource woff2 + data fallbacks
    # connect-src 'self'                fetch + EventSource are same-origin
    # frame-ancestors 'none'            anti-clickjacking
    # base-uri   'self'                 pin <base> for link normalisation
    # form-action 'self'                no cross-origin form submission
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict-Transport-Security belongs on the TLS-terminating edge.
    # When TLS lands, set it on the outer reverse proxy (not here) so it
    # attaches only to HTTPS responses.

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pre-paint theme script — must revalidate, NOT immutable-cache. Unlike
    # Vite's content-hashed bundles, /theme-init.js has a stable filename, so
    # the 1-year immutable rule below would pin a returning visitor's browser
    # to a stale copy for up to a year if the theme logic ever changes (e.g.
    # the localStorage key is renamed) — producing a flash of the wrong theme
    # the script exists to prevent. An exact-match location wins over the
    # regex block. The file is ~1KB, so revalidating every load is free.
    # (add_header does not inherit once a location sets its own, so re-emit.)
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does NOT inherit add_header from the server block once a
        # location declares its own. Re-emit security headers here so
        # long-cached assets don't ship naked.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
