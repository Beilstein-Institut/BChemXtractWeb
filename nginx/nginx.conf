server {
    listen 80;
    server_name _;

    # Frontend SPA (proxied to frontend container)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extraction can take up to 120s for complex files.
        # Set proxy timeout to 130s so the backend 503 arrives
        # before nginx returns its own 504 Gateway Timeout.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;

        # Batch SSE progress streams stay open for up to 30 minutes.
        # SSE connections send periodic events so they won't idle-timeout.
    }

    # FastAPI OpenAPI docs proxy
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
