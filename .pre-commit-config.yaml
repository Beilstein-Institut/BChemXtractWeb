minimum_pre_commit_version: '3.2.0'
# `pre-commit install` sets up both git hooks; hooks run at commit unless they say otherwise.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
      - id: uv-lock
        files: ^backend/(pyproject\.toml|uv\.lock)$
        args: [--project, backend]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --fix "$@"' --
        language: system
        files: '\.(ts|tsx)$'
        types: [file]
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx prettier --write "$@"' --
        language: system
        files: '\.(ts|tsx|css|json)$'
        types: [file]
      - id: ai-review
        name: AI code + security review (claude)
        entry: scripts/ai-review.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
