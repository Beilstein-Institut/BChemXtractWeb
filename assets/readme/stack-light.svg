    </filter>
    <filter id="cs" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1E2A78" flood-opacity="0.18"/>
    </filter>
  </defs>

