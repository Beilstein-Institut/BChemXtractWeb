<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="BChemXtractWeb. Extract, browse, search, export.">
  <title>BChemXtractWeb. Extract, browse, search, export.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b22"/>
      <stop offset="48%" stop-color="#0c1438"/>
      <stop offset="100%" stop-color="#08191c"/>
    </linearGradient>
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a52c9" stop-opacity="0.78"/>
      <stop offset="55%" stop-color="#1E2A78" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1E2A78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1fbfaf" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#096779" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4f7e" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#c61354" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7f9ff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#f7f9ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f7f9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f7f9ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f7f9ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f7f9ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f7f9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="haloBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <g filter="url(#orbBlur)">
    <circle cx="170" cy="100" r="190" fill="url(#orbIndigo)"/>
    <circle cx="1130" cy="80"  r="200" fill="url(#orbRose)"/>
    <circle cx="640"  cy="400" r="260" fill="url(#orbTeal)"/>
    <circle cx="1020" cy="340" r="170" fill="url(#orbIndigo)"/>
    <circle cx="280"  cy="360" r="150" fill="url(#orbRose)"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="68" y="64" width="1144" height="292" rx="30" fill="url(#cardFill)" stroke="url(#cardBorder)" stroke-width="1.6"/>
  </g>
  <path d="M92 64 H1188 a4 4 0 0 1 4 4 v2 H88 v-2 a4 4 0 0 1 4 -4 z" fill="url(#topShine)"/>

  <!-- Soft halo behind icon so it doesn't float on the dark surface -->
  <g filter="url(#haloBlur)">
