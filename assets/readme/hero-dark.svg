  <text x="336" y="226" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="6" font-style="italic" fill="#9ca3c7">EXTRACT   .   BROWSE   .   SEARCH   .   EXPORT</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd0e8">
    <text x="336" y="276">A browser-first gateway to the <tspan fill="#f7f9ff" font-weight="600">BChemXtract</tspan> Java library.</text>
    <text x="336" y="302">Any chemist can pull structures and reactions out of</text>
    <text x="336" y="328">ChemDraw files, without ever opening a terminal.</text>
  </g>

