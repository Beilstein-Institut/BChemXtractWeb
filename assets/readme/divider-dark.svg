<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 56" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="80%"  stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="capsuleStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- thin gradient rule -->
  <rect x="0" y="27" width="1280" height="1" fill="url(#line)"/>

  <!-- central glass capsule with mini benzene -->
  <g transform="translate(640 28)" filter="url(#soft)">
    <rect x="-44" y="-14" width="88" height="28" rx="14" fill="url(#capsule)" stroke="url(#capsuleStroke)" stroke-width="1"/>
  </g>
  <g transform="translate(640 28)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" stroke="#ef4f7e" stroke-width="1.4"/>
    <polygon points="0,-5 4.3,-2.5 4.3,2.5 0,5 -4.3,2.5 -4.3,-2.5" stroke="#1fbfaf" stroke-width="1"/>
  </g>
  <circle cx="610" cy="28" r="1.8" fill="#a5acc7"/>
  <circle cx="670" cy="28" r="1.8" fill="#a5acc7"/>

  <!-- side accents -->
  <circle cx="200"  cy="28" r="2"   fill="#1fbfaf" opacity="0.55"/>
  <circle cx="1080" cy="28" r="2"   fill="#ef4f7e" opacity="0.55"/>
  <circle cx="360"  cy="28" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="920"  cy="28" r="1.5" fill="#ffffff" opacity="0.35"/>
</svg>
