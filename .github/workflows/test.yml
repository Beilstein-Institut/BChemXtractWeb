name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bchemxtract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          # Cache key keyed on the resolved upstream tag so a new BChemXtract
          # release naturally invalidates the cache. We resolve once below
          # and stash the value in $GITHUB_ENV so subsequent steps reuse it.
          path: ~/.m2
          key: ${{ runner.os }}-m2-bchemxtract
          restore-keys: ${{ runner.os }}-m2-

      - name: Build BChemXtract fat JAR
        working-directory: backend
        run: bash scripts/build_jar.sh

      # Build the first-party faithful renderer jar too, so the render.svg
      # endpoint tests run for real instead of hitting 503 RENDER_UNAVAILABLE.
      # Mirrors the Dockerfile's cdx-render build step.
      - name: Build cdx-render JAR
        working-directory: backend
        run: bash scripts/build_cdx_render.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bchemxtract_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=default

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright + axe a11y suite
        run: npx playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Regenerates the claymorphic "tests" README chip with the real outcome and
  # pushes it to the `badges` branch (which the README embeds via raw URLs).
  # Runs on main pushes only — PR runs must not overwrite main's badge.
  badge:
    name: Update tests badge
    needs: [backend-tests, frontend-unit-tests, frontend-build, frontend-e2e]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: readme-badges
    steps:
      - uses: actions/checkout@v5

      - name: Generate and push badge
        run: |
          STATUS=passing
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            STATUS=failing
          fi
          python3 scripts/generate_badges.py --ci tests --status "$STATUS" --out /tmp/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git worktree add -B badges /tmp/wt origin/badges
          else
            git worktree add --detach /tmp/wt
            git -C /tmp/wt checkout --orphan badges
            git -C /tmp/wt rm -rf --quiet . 2>/dev/null || true
          fi
          cp /tmp/badges/*.svg /tmp/wt/
          git -C /tmp/wt add -A
          git -C /tmp/wt diff --cached --quiet || git -C /tmp/wt commit -m "badge: tests $STATUS"
          git -C /tmp/wt push origin badges || {
            git -C /tmp/wt pull --rebase origin badges && git -C /tmp/wt push origin badges
          }
