name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  frontend-lint:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Format check (prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "e2e/**/*.ts" index.html

  # Regenerates the claymorphic "lint" README chip with the real outcome and
  # pushes it to the `badges` branch (which the README embeds via raw URLs).
  # Runs on main pushes only — PR runs must not overwrite main's badge.
  badge:
    name: Update lint badge
    needs: [backend-lint, frontend-lint]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: readme-badges
    steps:
      - uses: actions/checkout@v5

      - name: Generate and push badge
        run: |
          STATUS=passing
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            STATUS=failing
          fi
          python3 scripts/generate_badges.py --ci lint --status "$STATUS" --out /tmp/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git worktree add -B badges /tmp/wt origin/badges
          else
            git worktree add --detach /tmp/wt
            git -C /tmp/wt checkout --orphan badges
            git -C /tmp/wt rm -rf --quiet . 2>/dev/null || true
          fi
          cp /tmp/badges/*.svg /tmp/wt/
          git -C /tmp/wt add -A
          git -C /tmp/wt diff --cached --quiet || git -C /tmp/wt commit -m "badge: lint $STATUS"
          git -C /tmp/wt push origin badges || {
            git -C /tmp/wt pull --rebase origin badges && git -C /tmp/wt push origin badges
          }
