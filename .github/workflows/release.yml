name: Release

# Requires one of the following to be able to open the release PR
# (organization policy blocks the default GITHUB_TOKEN from doing so):
#
#   1. Repo admin toggles ON
#        Settings → Actions → General → Workflow permissions →
#        "Allow GitHub Actions to create and approve pull requests"
#      This is the simplest path and keeps the workflow using the
#      default GITHUB_TOKEN.
#
#   2. Provide a `RELEASE_PLEASE_TOKEN` repository secret holding a
#      fine-grained personal access token (or GitHub App installation
#      token) with `pull-requests: write` + `contents: write`. The
#      workflow below prefers that secret when set.
#
# Without one of these, the job fails with
#   "GitHub Actions is not permitted to create or approve pull requests"
# and no release PR is opened.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      # Config lives in release-please-config.json + .release-please-manifest.json
      # (the action's default paths) rather than inline here, because inline mode
      # only knows how to bump one package. The config also carries the version
      # out to frontend/package.json (the number the About page shows) and to the
      # project's own entry in backend/uv.lock, which the `uv lock --check` gate
      # in lint.yml would otherwise fail on for every release PR.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
