name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the gitleaks binary directly rather than going through
      # gitleaks/gitleaks-action@v2. The action wrapper gates
      # organization-owned repositories behind a paid commercial license
      # (https://gitleaks.io/products.html), but the underlying scanner
      # is MIT-licensed and free to use — so we pin the binary version
      # and run it ourselves.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: |
          ./gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts=--all
