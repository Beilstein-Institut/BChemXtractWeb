# SEC H-04 / H-05: every secret-bearing env var in this file is
# explicitly sourced from the shell environment with a mandatory-marker
# (``${VAR:?message}``) so ``docker compose up`` will FAIL FAST with a
# clear message if the operator hasn't provisioned the value. No
# credential, secret key, or admin token has a default — running with the
# dev defaults is physically impossible.
#
# Provision the required environment in a local ``.env`` file (gitignored)
# alongside this compose file:
#
#   POSTGRES_PASSWORD=<32+ random chars>
#   SECRET_KEY=<32+ random chars>      # PBKDF2 salt + CSRF HMAC (D-10/D-19)
#   ADMIN_SECRET=<32+ random chars>    # X-Admin-Secret gate (D-11)
#
# Or export them in the shell before ``docker compose up``. ``deploy.sh``
# mints all three on first run via ``secrets.token_urlsafe(32)``.
#
# Optional non-secret tunables (all have :- defaults so an absent .env still
# produces a working stack):
#   HTTP_PORT=3000        # public-facing nginx port (host)
#   BACKEND_PORT=8000     # backend FastAPI port (host, loopback-bound only)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bchemxtract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (32+ random chars)}
      POSTGRES_DB: ${POSTGRES_DB:-bchemxtract}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SEC H-04: Postgres is only reachable on the internal Docker network.
    # Port 5432 is NOT bound to the host — backend + celery connect via
    # the service name. Remove the line below only in development when a
    # local psql client needs direct access, and never in a deployment.
    #   ports:
    #     - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bchemxtract}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SEC M-08: one-shot schema-migration container. Runs `alembic upgrade
  # head` once and exits. The backend depends on it via
  # `condition: service_completed_successfully` so a failed migration
  # aborts deployment cleanly instead of crash-looping the backend.
  #
  # Data backfills (notably `canonical_smiles`) are NOT run here — they
  # are JVM-backed and shipped as a standalone management command
  # (`python -m scripts.backfill_canonical_smiles`). Operators invoke it
  # manually after a first-time deploy.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BCHEMXTRACT_REF: ${BCHEMXTRACT_VERSION:-}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      # migrate runs as the bootstrap superuser — DDL (RLS policies,
      # CREATE ROLE for bchemxtract_app) requires superuser privileges.
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-bchemxtract}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-bchemxtract}"
      JAR_PATH: /app/jars
      # Phase 11: app.config.Settings is imported during alembic env.py
      # bootstrap; the `_validate_phase11_secrets` + `_validate_prod_cors`
      # validators refuse to load with mismatched DEBUG/CORS_ORIGINS values.
      # Propagate the same posture the backend uses so Settings instantiates
      # identically in both containers.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (32+ chars)}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set (32+ chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:${HTTP_PORT:-3000}"]'}
      DEBUG: ${DEBUG:-false}
      # The 2026_05_16_create_app_role migration reads APP_DB_PASSWORD from
      # the environment and CREATE / ALTER ROLEs bchemxtract_app with it.
      # Runtime services (backend, celery-worker, celery-beat) then connect
      # as bchemxtract_app — a NOSUPERUSER NOBYPASSRLS role — so RLS
      # policies actually enforce on every query.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (32+ chars)}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Pin the JAR-builder stage to the same release the frontend footer
        # advertises. deploy.sh resolves this once via `git ls-remote --sort`
        # and writes BCHEMXTRACT_VERSION to .env. Empty value (no .env) lets
        # the Dockerfile fall back to its own auto-resolve.
        BCHEMXTRACT_REF: ${BCHEMXTRACT_VERSION:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # SEC M-08: backend refuses to start until migrations complete.
      migrate:
        condition: service_completed_successfully
    environment:
      # Runtime backend connects as bchemxtract_app — NOSUPERUSER NOBYPASSRLS
      # so RLS policies enforce on every query. The role is created by the
      # 2026_05_16_create_app_role migration (running as the bootstrap
      # superuser in the migrate service).
      DATABASE_URL: "postgresql+psycopg://bchemxtract_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (32+ chars)}@db:5432/${POSTGRES_DB:-bchemxtract}"
      JAR_PATH: /app/jars
      # Phase 11 cookie posture: DEBUG=false enforces Secure flag on bcx_sid
      # cookie (HTTPS-only) AND refuses CORS_ORIGINS that contain
      # localhost/127.0.0.1 (the _validate_prod_cors guard). For local
      # plain-HTTP testing on http://localhost:${HTTP_PORT}, set DEBUG=true
      # in .env. Real deployments behind HTTPS keep DEBUG=false.
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:${HTTP_PORT:-3000}"]'}
      DEBUG: ${DEBUG:-false}
      # Phase 11: SECRET_KEY (PBKDF2 salt for API-key hashes + CSRF HMAC) and
      # ADMIN_SECRET (X-Admin-Secret gate) are required. Settings validator
      # refuses to start with values shorter than 32 chars when DEBUG=false.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (32+ chars)}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set (32+ chars)}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      # Loopback bind: the backend FastAPI is reachable only from the deploy
      # host (CLI scripts, curl on the same box). Browser traffic goes through
      # nginx on HTTP_PORT. Override BACKEND_PORT in .env to change the host
      # port; replace 127.0.0.1 with 0.0.0.0 to expose on the network (rare).
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the SPA bundle as VITE_BCHEMXTRACT_VERSION at build time
        # so the footer can render the running version without a live API call.
        # deploy.sh writes BCHEMXTRACT_VERSION to .env before `compose build`.
        BCHEMXTRACT_VERSION: ${BCHEMXTRACT_VERSION:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      # Host:container. HTTP_PORT comes from .env (written by deploy.sh).
      # The :-3000 default keeps the stack runnable even on a hand-rolled .env.
      - "${HTTP_PORT:-3000}:80"
    volumes:
      # Phase 11 (Plan 11-05) removed the last envsubst variable from
      # nginx.conf.template, so no substitution step is needed. Mount the
      # template file directly as the final config: nginx loads everything in
      # /etc/nginx/conf.d/*.conf at startup.
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BCHEMXTRACT_REF: ${BCHEMXTRACT_VERSION:-}
    restart: unless-stopped
    # SEC H-03: --pool=solo is mandatory — extraction tasks use
    # asyncio.run() internally and will error on prefork/thread pools.
    # The Celery app also asserts solo pool at worker_process_init.
    command: celery -A app.celery_app worker --pool=solo --concurrency=1 -l info
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      # celery-worker runs extraction tasks that read/write user data —
      # connect as bchemxtract_app so RLS policies enforce ownership.
      DATABASE_URL: "postgresql+psycopg://bchemxtract_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (32+ chars)}@db:5432/${POSTGRES_DB:-bchemxtract}"
      JAR_PATH: /app/jars
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      # Phase 11: required by app.config.Settings on import (same constraint
      # as the backend service — including _validate_prod_cors).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (32+ chars)}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set (32+ chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:${HTTP_PORT:-3000}"]'}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # Override the Dockerfile's baked-in HEALTHCHECK, which curls :8000 — that
    # is correct for the backend service (uvicorn) but wrong for this container,
    # which runs a Celery worker and has no HTTP server. `inspect ping`
    # round-trips through Redis, confirming both the worker process is alive
    # and the broker is reachable.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$(hostname) -t 10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Phase 11 D-17 (Plan 11-08): single-replica Celery beat scheduler. Fires
  # the daily `audit_log.prune_old_entries` task at 03:00 UTC to enforce the
  # 12-month audit-log retention window. The task is idempotent (a re-run
  # with no stale rows removes zero), so an accidental double-beat would
  # still produce the right outcome — just extra log noise. Beat has no
  # HTTP server and no Redis ping handle, so no healthcheck — the
  # `restart: unless-stopped` policy is the only liveness mechanism.
  # No --pool=solo flag: beat doesn't run JVM extraction tasks (the prune
  # is pure SQL inside asyncio.run, see app/tasks/audit_log.py).
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BCHEMXTRACT_REF: ${BCHEMXTRACT_VERSION:-}
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # celery-beat reads/writes audit_log rows (prune task). Connect as the
      # NOBYPASSRLS app role — the prune target is the global audit_log
      # table which has no per-row RLS policy, so the app role's CRUD
      # grant from the 2026_05_16_create_app_role migration is sufficient.
      DATABASE_URL: "postgresql+psycopg://bchemxtract_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (32+ chars)}@db:5432/${POSTGRES_DB:-bchemxtract}"
      JAR_PATH: /app/jars
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (32+ chars)}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set (32+ chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:${HTTP_PORT:-3000}"]'}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

volumes:
  pgdata:
